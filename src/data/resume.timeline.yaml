intro:
  lead:
    en: "Brazil-based Software Engineer focused on backend systems, APIs, data, and cloud infrastructure."
    br: "Engenheiro de Software baseado no Brasil, com foco em sistemas backend, APIs, dados e infraestrutura em cloud."
  paragraphs:
    - en: "I build reliable, data-driven software with **Python**, working across backend architecture, REST APIs, databases, distributed workflows, and automation. My experience includes **Django, Django REST Framework, FastAPI, PostgreSQL, Airflow, AWS, and modern CI/CD and observability practices**."
      br: "Desenvolvo software confiável e orientado a dados utilizando **Python**, atuando em arquitetura backend, APIs REST, bancos de dados, workflows distribuídos e automação. Minha experiência inclui **Django, Django REST Framework, FastAPI, PostgreSQL, Airflow, AWS e práticas modernas de CI/CD e observabilidade**."
    - en: "Currently working on software for the **renewable energy and water resources** domain, developing systems involving hydrological forecasting, telemetry, and power-generation operations."
      br: "Atualmente trabalho no desenvolvimento de software para o setor de **energia renovável e recursos hídricos**, atuando em sistemas relacionados a previsão hidrológica, telemetria e operações de geração de energia."
    - en: "I also build independent software projects, with a strong interest in **software architecture, infrastructure, open source, and continuous learning**."
      br: "Também desenvolvo projetos de software de forma independente, com interesse especial em **arquitetura de software, infraestrutura, open source e aprendizado contínuo**."
  location:
    en: "Based in São José dos Campos, Brazil."
    br: "Baseado em São José dos Campos, Brasil."

